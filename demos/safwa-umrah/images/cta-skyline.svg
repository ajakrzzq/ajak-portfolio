    <radialGradient id="ctaGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#c8a35f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8a35f" stop-opacity="0"/>
