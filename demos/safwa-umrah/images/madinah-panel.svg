<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated dusk view of the Prophet's Mosque with its green dome and minarets, representing Madinah">
  <defs>
    <linearGradient id="mdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="45%" stop-color="#152c33"/>
      <stop offset="78%" stop-color="#3b4a3c"/>
      <stop offset="100%" stop-color="#cdb27c"/>
    </linearGradient>
    <radialGradient id="mdGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#e9c98a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e9c98a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="mdMinaret" viewBox="0 0 40 260">
      <rect x="14" y="60" width="12" height="200"/>
      <polygon points="8,60 32,60 20,18"/>
      <rect x="17" y="2" width="6" height="14"/>
      <circle cx="20" cy="0" r="4"/>
    </symbol>
  </defs>

  <rect width="1200" height="1400" fill="url(#mdSky)"/>
  <circle cx="600" cy="1250" r="560" fill="url(#mdGlow)"/>

  <g fill="#0a1a1e">
    <use href="#mdMinaret" x="140" y="740" width="44" height="390"/>
    <use href="#mdMinaret" x="1010" y="740" width="44" height="390"/>
    <use href="#mdMinaret" x="320" y="820" width="32" height="310"/>
    <use href="#mdMinaret" x="850" y="820" width="32" height="310"/>
  </g>

  <g>
    <path d="M340 1130 Q340 920 600 870 Q860 920 860 1130 Z" fill="#1f4d3a"/>
    <circle cx="600" cy="860" r="9" fill="#0a1a1e"/>
    <rect x="470" y="1040" width="260" height="210" fill="#0a1a1e"/>
    <rect x="500" y="1096" width="200" height="16" fill="#c8a35f"/>
  </g>

  <linearGradient id="mdFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050b0d" stop-opacity="0"/>
    <stop offset="100%" stop-color="#050b0d" stop-opacity="0.88"/>
  </linearGradient>
  <rect width="1200" height="1400" fill="url(#mdFade)"/>
</svg>
