<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated sunrise skyline of the Holy Mosque with minarets, representing Makkah">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1e17"/>
      <stop offset="40%" stop-color="#16392c"/>
      <stop offset="68%" stop-color="#5f6a45"/>
      <stop offset="100%" stop-color="#f0d095"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#f8e0ab" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e3a95f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e3a95f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07130e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07130e" stop-opacity="0.92"/>
    </linearGradient>
    <symbol id="minaret" viewBox="0 0 40 260">
      <rect x="14" y="60" width="12" height="200"/>
      <polygon points="8,60 32,60 20,18"/>
      <rect x="17" y="2" width="6" height="14"/>
      <circle cx="20" cy="0" r="4"/>
    </symbol>
    <symbol id="dome" viewBox="0 0 200 140">
      <path d="M0 140 Q0 38 100 16 Q200 38 200 140 Z"/>
      <circle cx="100" cy="10" r="6"/>
    </symbol>
    <symbol id="pilgrim" viewBox="0 0 40 90">
      <path d="M20 28 Q5 40 5 66 Q5 90 20 90 Q35 90 35 66 Q35 40 20 28 Z"/>
      <circle cx="20" cy="16" r="10"/>
    </symbol>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1420" cy="1080" r="640" fill="url(#glow)"/>

  <g fill="#0b2118" opacity="0.97">
    <use href="#minaret" x="120" y="700" width="30" height="230"/>
    <use href="#dome" x="205" y="850" width="150" height="105"/>
    <use href="#minaret" x="370" y="760" width="24" height="170"/>

    <use href="#minaret" x="640" y="560" width="44" height="360"/>
    <use href="#dome" x="740" y="640" width="420" height="290"/>
    <rect x="866" y="770" width="180" height="180"/>
    <rect x="890" y="806" width="132" height="14" fill="#c8a35f"/>
    <rect x="920" y="890" width="60" height="60" fill="#04100b"/>
    <rect x="920" y="908" width="60" height="10" fill="#c8a35f"/>
    <use href="#minaret" x="1170" y="560" width="44" height="360"/>

    <use href="#minaret" x="510" y="640" width="34" height="290"/>
    <use href="#minaret" x="1310" y="640" width="34" height="290"/>

    <use href="#dome" x="1440" y="850" width="170" height="110"/>
    <use href="#minaret" x="1630" y="720" width="30" height="210"/>
    <use href="#minaret" x="1770" y="790" width="24" height="150"/>
  </g>

  <g fill="#050e0a" opacity="0.9">
    <use href="#pilgrim" x="230" y="962" width="34" height="76"/>
    <use href="#pilgrim" x="285" y="978" width="26" height="58"/>
    <use href="#pilgrim" x="1080" y="968" width="30" height="70"/>
    <use href="#pilgrim" x="1130" y="982" width="22" height="52"/>
    <use href="#pilgrim" x="1620" y="972" width="28" height="64"/>
  </g>

  <rect width="1920" height="1080" fill="url(#groundFade)"/>
</svg>
