<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b46f0" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3b46f0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b46f0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="deskGrad" x1="0" y1="680" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12182a"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b46f0"/>
      <stop offset="55%" stop-color="#7c5cf0"/>
      <stop offset="100%" stop-color="#c65cd8"/>
    </linearGradient>

    <linearGradient id="panelGradSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a54f2"/>
      <stop offset="100%" stop-color="#9a5cf0"/>
    </linearGradient>

    <radialGradient id="photoGlow" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="keyGrid" width="17" height="15" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="13" height="11" rx="3" fill="#1b2133"/>
    </pattern>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blurTiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- faint directional beam connecting the clean left to the lit workspace -->
  <polygon points="260,0 640,0 1040,900 660,900" fill="#3b46f0" opacity="0.05" filter="url(#blurSoft)"/>

  <!-- ambient studio glow -->
  <circle cx="1230" cy="250" r="330" fill="url(#glowViolet)" filter="url(#blurSoft)"/>
  <circle cx="1500" cy="520" r="260" fill="url(#glowBlue)" filter="url(#blurSoft)"/>
  <circle cx="980" cy="640" r="200" fill="url(#glowViolet)" filter="url(#blurSoft)" opacity="0.5"/>

  <!-- desk surface -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#deskGrad)"/>
  <rect x="560" y="681" width="1040" height="3" fill="#ffffff" opacity="0.06"/>

  <!-- workspace hardware, shifted right of centre so a wide clean zone
       always remains on the left for the headline, independent of how
       any particular viewport crops the background -->
  <g transform="translate(300,0) scale(0.81)">
    <ellipse cx="1180" cy="760" rx="430" ry="70" fill="url(#glowBlue)" opacity="0.28" filter="url(#blurMed)"/>

    <!-- monitor stand -->
    <rect x="1152" y="558" width="18" height="92" rx="7" fill="#171d2c"/>
    <ellipse cx="1161" cy="656" rx="96" ry="14" fill="#0f131c"/>

    <!-- monitor ambient glow -->
    <rect x="640" y="100" width="960" height="480" rx="34" fill="url(#glowBlue)" opacity="0.4" filter="url(#blurSoft)"/>

    <!-- ultrawide monitor -->
    <g>
      <rect x="664" y="136" width="912" height="428" rx="20" fill="#10131c" stroke="#262c3e" stroke-width="2"/>
      <rect x="686" y="158" width="868" height="384" rx="10" fill="#0b1120"/>

      <!-- browser / nav bar -->
      <rect x="686" y="158" width="868" height="46" rx="10" fill="#131a2c"/>
      <rect x="686" y="182" width="868" height="22" fill="#131a2c"/>
      <circle cx="716" cy="181" r="6" fill="#5a67f5"/>
      <rect x="736" y="175" width="76" height="11" rx="5.5" fill="#3c4560"/>
      <rect x="980" y="176" width="44" height="9" rx="4.5" fill="#3c4560" opacity="0.85"/>
      <rect x="1042" y="176" width="44" height="9" rx="4.5" fill="#3c4560" opacity="0.85"/>
      <rect x="1104" y="176" width="44" height="9" rx="4.5" fill="#3c4560" opacity="0.85"/>
      <rect x="1424" y="169" width="106" height="24" rx="12" fill="#3b46f0"/>

      <!-- hero: headline column -->
      <rect x="718" y="228" width="130" height="10" rx="5" fill="#3c4560"/>
      <rect x="718" y="254" width="220" height="24" rx="6" fill="#e8eaf6"/>
      <rect x="718" y="284" width="176" height="24" rx="6" fill="#e8eaf6"/>
      <rect x="718" y="322" width="200" height="11" rx="5.5" fill="#525c7a"/>
      <rect x="718" y="340" width="150" height="11" rx="5.5" fill="#525c7a"/>
      <rect x="718" y="374" width="118" height="32" rx="16" fill="#3b46f0"/>
      <rect x="848" y="374" width="88" height="32" rx="16" fill="none" stroke="#3c4560" stroke-width="1.5"/>

      <!-- hero: photographic panel, not a flat color card -->
      <rect x="986" y="210" width="568" height="224" rx="16" fill="url(#panelGrad)"/>
      <rect x="986" y="210" width="568" height="224" rx="16" fill="url(#photoGlow)"/>
      <rect x="1012" y="378" width="248" height="44" rx="10" fill="#05070d" opacity="0.38"/>
      <rect x="1030" y="390" width="180" height="11" rx="5.5" fill="#ffffff" opacity="0.85"/>
      <rect x="1030" y="406" width="128" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
      <rect x="1370" y="372" width="150" height="50" rx="12" fill="#0b1120" opacity="0.92" stroke="#262c3e" stroke-width="1.5"/>
      <circle cx="1392" cy="397" r="10" fill="#7c86ff" opacity="0.9"/>
      <rect x="1412" y="390" width="90" height="8" rx="4" fill="#c7cbe0"/>
      <rect x="1412" y="404" width="64" height="7" rx="3.5" fill="#525c7a"/>

      <!-- content section: a row of service/portfolio cards below the hero -->
      <g>
        <rect x="718" y="446" width="267" height="84" rx="12" fill="#131a2c" stroke="#232a3e" stroke-width="1.5"/>
        <rect x="732" y="460" width="56" height="42" rx="8" fill="url(#panelGradSm)"/>
        <rect x="800" y="464" width="150" height="11" rx="5.5" fill="#c7cbe0"/>
        <rect x="800" y="482" width="110" height="9" rx="4.5" fill="#525c7a"/>
        <rect x="800" y="502" width="50" height="8" rx="4" fill="#3c4560" opacity="0.75"/>

        <rect x="1003" y="446" width="267" height="84" rx="12" fill="#131a2c" stroke="#232a3e" stroke-width="1.5"/>
        <rect x="1017" y="460" width="56" height="42" rx="8" fill="url(#panelGrad)"/>
        <rect x="1085" y="464" width="150" height="11" rx="5.5" fill="#c7cbe0"/>
        <rect x="1085" y="482" width="122" height="9" rx="4.5" fill="#525c7a"/>
        <rect x="1085" y="502" width="50" height="8" rx="4" fill="#3c4560" opacity="0.75"/>

        <rect x="1288" y="446" width="266" height="84" rx="12" fill="#131a2c" stroke="#232a3e" stroke-width="1.5"/>
        <rect x="1302" y="460" width="56" height="42" rx="8" fill="url(#panelGradSm)"/>
        <rect x="1370" y="464" width="150" height="11" rx="5.5" fill="#c7cbe0"/>
        <rect x="1370" y="482" width="100" height="9" rx="4.5" fill="#525c7a"/>
        <rect x="1370" y="502" width="50" height="8" rx="4" fill="#3c4560" opacity="0.75"/>
      </g>
    </g>

    <!-- secondary device: responsive / mobile preview -->
    <g transform="translate(1318,462) rotate(-7)">
      <rect x="-8" y="-8" width="206" height="346" rx="30" fill="url(#glowBlue)" opacity="0.35" filter="url(#blurMed)"/>
      <rect x="0" y="0" width="190" height="330" rx="26" fill="#10131c" stroke="#262c3e" stroke-width="2"/>
      <rect x="10" y="10" width="170" height="310" rx="18" fill="#0b1120"/>
      <rect x="78" y="20" width="34" height="7" rx="3.5" fill="#232a3e"/>

      <rect x="26" y="54" width="138" height="76" rx="12" fill="url(#panelGradSm)"/>
      <rect x="26" y="54" width="138" height="76" rx="12" fill="url(#photoGlow)"/>
      <rect x="26" y="146" width="138" height="13" rx="6.5" fill="#e8eaf6"/>
      <rect x="26" y="167" width="98" height="11" rx="5.5" fill="#525c7a"/>
      <rect x="26" y="196" width="138" height="32" rx="16" fill="#3b46f0"/>
      <rect x="26" y="244" width="138" height="56" rx="12" fill="#131a2c" stroke="#262c3e" stroke-width="1.5"/>
      <rect x="40" y="258" width="34" height="30" rx="7" fill="url(#panelGrad)"/>
      <rect x="84" y="262" width="70" height="9" rx="4.5" fill="#c7cbe0"/>
      <rect x="84" y="278" width="52" height="8" rx="4" fill="#525c7a"/>
    </g>

    <!-- keyboard -->
    <g transform="translate(766,652)">
      <rect x="0" y="0" width="384" height="78" rx="14" fill="#12161f" stroke="#262c3e" stroke-width="1.5"/>
      <rect x="12" y="12" width="360" height="42" rx="6" fill="url(#keyGrid)"/>
      <rect x="10" y="70" width="364" height="4" rx="2" fill="#3b46f0" opacity="0.65" filter="url(#blurTiny)"/>
    </g>

    <!-- mouse -->
    <g transform="translate(1198,664)">
      <ellipse cx="30" cy="42" rx="30" ry="44" fill="#12161f" stroke="#262c3e" stroke-width="1.5"/>
      <line x1="30" y1="6" x2="30" y2="36" stroke="#262c3e" stroke-width="1.5"/>
      <circle cx="30" cy="17" r="3" fill="#5a67f5" opacity="0.9"/>
    </g>
  </g>

  <!-- soft bokeh -->
  <circle cx="900" cy="200" r="5" fill="#7c86ff" opacity="0.3"/>
  <circle cx="1560" cy="300" r="7" fill="#c65cd8" opacity="0.22" filter="url(#blurTiny)"/>
  <circle cx="1500" cy="140" r="4" fill="#7c86ff" opacity="0.35"/>
  <circle cx="960" cy="600" r="6" fill="#7c86ff" opacity="0.2" filter="url(#blurTiny)"/>
  <circle cx="1550" cy="640" r="5" fill="#c65cd8" opacity="0.25"/>
</svg>
